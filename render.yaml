# Render blueprint — native Bun web service (no Docker).
# Render's Node runtime includes Bun, so `bun` is available for build & start.
# In Render: New > Blueprint, point at this repo, then set WINTWEALTH_AUTH_TOKEN.
services:
  - type: web
    name: report-downloader
    runtime: node
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun run start
    healthCheckPath: /api/health
    envVars:
      # Report API auth token (X-AUTH-TOKEN) — set in dashboard, not committed.
      - key: WINTWEALTH_AUTH_TOKEN
        sync: false
      # Optional overrides (defaults: agentId 333, host below).
      - key: AGENT_ID
        value: "333"
      - key: WINTWEALTH_BASE_URL
        value: https://elb.api.wintwealth.com
      - key: NODE_ENV
        value: production
